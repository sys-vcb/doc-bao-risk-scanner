version: '3.8'

services:
  risk_scanner:
    build: .
    container_name: risk_news_scanner
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_NAME=${SENDER_NAME}
    volumes:
      - ./risk_scanner.db:/app/risk_scanner.db
      - ./storage/reports:/app/storage/reports
